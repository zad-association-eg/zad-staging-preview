<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>ZAD helper</title></head>
<body>
<img class="brand-logo" src="assets/zad-logo.webp" alt="ZAD" hidden>
<script>
(function(){
  try{
    const d=parent.document;
    const style=d.createElement('style');
    style.id='zad-footer-signature-style';
    style.textContent=`
      footer{
        position:relative!important;
        overflow:hidden!important;
        padding:44px 0 30px!important;
        text-align:center!important;
        background:
          radial-gradient(circle at 50% 0%,rgba(82,247,232,.10),transparent 34%),
          linear-gradient(135deg,rgba(3,48,66,.78),rgba(5,91,82,.72),rgba(4,53,76,.80))!important;
        border-top:1px solid rgba(223,252,255,.16)!important;
      }
      footer:before{
        content:"";
        position:absolute;
        top:0;left:50%;
        width:min(680px,72vw);height:1px;
        transform:translateX(-50%);
        background:linear-gradient(90deg,transparent,#52F7E8 30%,#F0C45F 50%,#52F7E8 70%,transparent);
        box-shadow:0 0 18px rgba(82,247,232,.45);
        animation:zadFooterLine 5.8s ease-in-out infinite;
      }
      footer .wrap{position:relative;z-index:2}
      footer .footer-grid{
        display:flex!important;
        flex-direction:column!important;
        justify-content:center!important;
        align-items:center!important;
        gap:19px!important;
        text-align:center!important;
      }
      footer .footer-grid>div,
      footer .dev{
        width:100%!important;
        text-align:center!important;
        direction:rtl!important;
      }
      footer .footer-grid>div:first-child strong{
        display:block!important;
        margin:0 auto 5px!important;
        color:#F8FDFF!important;
        font-size:13px!important;
        line-height:1.9!important;
        font-weight:700!important;
        text-align:center!important;
      }
      footer .footer-grid>div:first-child span{
        display:block!important;
        color:#B8D6DE!important;
        font:600 9px Manrope,sans-serif!important;
        letter-spacing:.05em!important;
        direction:ltr!important;
        text-align:center!important;
      }
      footer .dev:before{
        content:"تصميم وتطوير";
        display:block;
        margin:0 auto 7px;
        color:#D9EFF2;
        font-size:10px;
        font-weight:600;
        letter-spacing:.02em;
        opacity:.86;
        text-align:center;
      }
      footer .dev strong{
        position:relative;
        display:inline-block!important;
        margin:0 auto!important;
        padding:2px 12px 4px!important;
        font-size:clamp(18px,2.2vw,24px)!important;
        line-height:1.65!important;
        font-weight:800!important;
        letter-spacing:.01em!important;
        background:linear-gradient(105deg,#52F7E8 0%,#52F7E8 38%,#F4FFFF 49%,#52F7E8 60%,#52F7E8 100%);
        background-size:240% 100%;
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent!important;
        filter:drop-shadow(0 0 8px rgba(82,247,232,.30));
        animation:zadNameShine 5.7s cubic-bezier(.45,0,.2,1) infinite,zadNameBreathe 3.8s ease-in-out infinite;
        text-align:center!important;
      }
      footer .dev strong:after{
        content:"";
        position:absolute;
        left:12%;right:12%;bottom:-2px;
        height:1px;
        border-radius:99px;
        background:linear-gradient(90deg,transparent,rgba(82,247,232,.82),rgba(240,196,95,.72),transparent);
        transform:scaleX(.35);
        opacity:.42;
        animation:zadNameUnderline 4.6s ease-in-out infinite;
      }
      footer .dev span{
        display:block!important;
        width:max-content!important;
        max-width:100%!important;
        margin:7px auto 0!important;
        font:700 9px/1.8 Manrope,sans-serif!important;
        letter-spacing:.07em!important;
        direction:ltr!important;
        text-align:center!important;
        background:linear-gradient(90deg,#F0C45F,#FFF0B8,#52F7E8,#F0C45F);
        background-size:220% 100%;
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent!important;
        animation:zadLabelShimmer 7s linear infinite;
      }
      footer .rights{
        width:min(760px,100%)!important;
        margin:22px auto 0!important;
        padding-top:15px!important;
        border-top:1px solid rgba(221,252,255,.09)!important;
        color:#94B5BE!important;
        font-size:9px!important;
        line-height:1.9!important;
        text-align:center!important;
        direction:rtl!important;
      }
      @keyframes zadNameShine{0%,22%{background-position:100% 0}58%,100%{background-position:-120% 0}}
      @keyframes zadNameBreathe{0%,100%{filter:drop-shadow(0 0 6px rgba(82,247,232,.24));transform:translateY(0)}50%{filter:drop-shadow(0 0 15px rgba(82,247,232,.48));transform:translateY(-1px)}}
      @keyframes zadNameUnderline{0%,100%{transform:scaleX(.28);opacity:.28}50%{transform:scaleX(1);opacity:.75}}
      @keyframes zadLabelShimmer{to{background-position:-220% 0}}
      @keyframes zadFooterLine{0%,100%{opacity:.35;filter:brightness(.85)}50%{opacity:1;filter:brightness(1.3)}}
      @media(max-width:700px){
        footer{padding:38px 0 27px!important}
        footer .footer-grid{gap:17px!important}
        footer .dev,footer .dev span,footer .footer-grid>div{text-align:center!important}
        footer .dev strong{font-size:19px!important}
        footer .dev span{font-size:8px!important;letter-spacing:.045em!important}
      }
      @media(prefers-reduced-motion:reduce){
        footer:before,footer .dev strong,footer .dev strong:after,footer .dev span{animation:none!important}
        footer .dev strong{background:#52F7E8!important;-webkit-background-clip:text!important;background-clip:text!important;color:transparent!important;transform:none!important}
      }
    `;
    const old=d.getElementById(style.id);if(old)old.remove();
    d.head.appendChild(style);
  }catch(e){}
})();
</script>
</body>
</html>
